name: Job Status Bot

on:
  schedule:
    # Safety net only — real triggering is external (cron-job.org calling
    # workflow_dispatch every 15 min), since GitHub's own schedule trigger
    # is unreliably delayed (observed 55-255 min gaps on this repo).
    - cron: '0 * * * *'
  workflow_dispatch:
    inputs:
      resend_rfc822_msgid:
        description: 'RFC822 Message-ID to resend a specific notification'
        required: false
        type: string

jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: |
          if [ -n "$RESEND_RFC822_MSGID" ]; then
            python -m src.bot.main --resend-rfc822-msgid "$RESEND_RFC822_MSGID"
          else
            python -m src.bot.main
          fi
        env:
          RESEND_RFC822_MSGID: ${{ github.event.inputs.resend_rfc822_msgid }}
          GMAIL_CLIENT_ID: ${{ secrets.GMAIL_CLIENT_ID }}
          GMAIL_CLIENT_SECRET: ${{ secrets.GMAIL_CLIENT_SECRET }}
          GMAIL_REFRESH_TOKEN: ${{ secrets.GMAIL_REFRESH_TOKEN }}
          GMAIL_ACCOUNT: ${{ secrets.GMAIL_ACCOUNT }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
